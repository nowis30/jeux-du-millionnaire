databases:
  - name: hm-postgres
    plan: free

services:
  - type: web
    name: hm-server
    runtime: node
    rootDir: server
    plan: free
    autoDeploy: true
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run prisma:deploy && node dist/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hm-postgres
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://nowis.store,https://app.nowis.store,https://client-jeux-millionnaire.vercel.app,http://localhost:3000
      - key: APP_ORIGIN
        value: https://app.nowis.store
      - key: SITE_ORIGIN
        value: https://nowis.store
      - key: COOKIE_DOMAIN
        value: ""
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: ALLOW_VERCEL_PREVIEWS
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: MIGRATE_ON_BOOT
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: smorin_23@hotmail.com
      - key: ADMIN_VERIFY_SECRET
        generateValue: true
      - key: SKIP_EMAIL_VERIFICATION
        value: "false"
